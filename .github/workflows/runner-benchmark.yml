name: Runner benchmark

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-benchmark
  cancel-in-progress: false

jobs:
  benchmark:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: GitHub hosted
            runner: ubuntu-24.04
          - name: Home fleet
            runner: davidapps-linux-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Record environment
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "### ${{ matrix.name }}"
            echo
            echo '| Signal | Value |'
            echo '| --- | --- |'
            echo "| CPU threads | $(nproc) |"
            echo "| Memory | $(awk '/MemTotal/ { printf "%.1f GiB", $2 / 1024 / 1024 }' /proc/meminfo) |"
            echo "| Node | $(node --version) |"
            echo "| Kernel | $(uname -sr) |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Enable package manager
        run: corepack enable
      - name: Install dependencies
        run: time pnpm install --frozen-lockfile
      - name: Check, test and build
        run: time sh -c 'pnpm check && pnpm test && pnpm build'
      - name: CPU benchmark
        run: time node -e "require('node:crypto').pbkdf2Sync('runner-benchmark', 'fixed-salt', 2500000, 64, 'sha512')"
      - name: Work-volume write benchmark
        shell: bash
        run: |
          set -euo pipefail
          benchmark_file="$RUNNER_TEMP/runner-benchmark.bin"
          time dd if=/dev/zero of="$benchmark_file" bs=4M count=128 conv=fsync status=none
          time dd if="$benchmark_file" of=/dev/null bs=4M iflag=direct status=none
          rm -f "$benchmark_file"
