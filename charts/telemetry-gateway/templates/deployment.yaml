{{- $runtimeProjects := list -}}
{{- range $project := .Values.projects -}}
{{- $runtimeProject := dict "id" $project.id "hosts" $project.hosts "allowedOrigins" $project.allowedOrigins -}}
{{- range $key := list "publicKey" "ratePerSecond" "burst" "allowFaro" "allowTraces" "allowLogs" "allowMetrics" -}}
{{- if hasKey $project $key -}}
{{- $_ := set $runtimeProject $key (get $project $key) -}}
{{- end -}}
{{- end -}}
{{- $runtimeProjects = append $runtimeProjects $runtimeProject -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "telemetry-gateway.name" . }}
  labels:
    {{- include "telemetry-gateway.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "telemetry-gateway.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        {{- include "telemetry-gateway.labels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchLabels:
                  app.kubernetes.io/name: {{ include "telemetry-gateway.name" . }}
                  app.kubernetes.io/instance: {{ .Release.Name }}
              topologyKey: kubernetes.io/hostname
      containers:
        - name: gateway
          # A digest is an immutable image identity; a tag is not. When GitOps
          # supplies a digest it wins over the tag, including `latest`.
          {{- if .Values.image.digest }}
          image: {{ printf "%s@%s" .Values.image.repository .Values.image.digest | quote }}
          {{- else }}
          image: {{ printf "%s:%s" .Values.image.repository .Values.image.tag | quote }}
          {{- end }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
            readOnlyRootFilesystem: true
          env:
            - name: PORT
              value: {{ .Values.service.port | quote }}
            - name: ALLOY_FARO_URL
              value: {{ .Values.alloy.faroUrl | quote }}
            - name: ALLOY_OTLP_URL
              value: {{ .Values.alloy.otlpUrl | quote }}
            - name: MAX_BODY_BYTES
              value: {{ .Values.gateway.maxBodyBytes | quote }}
            - name: UPSTREAM_TIMEOUT_MS
              value: {{ .Values.gateway.upstreamTimeoutMs | quote }}
            - name: TELEMETRY_PROJECTS_JSON
              # Ingress-only chart configuration is intentionally omitted;
              # the runtime rejects unknown fields to catch policy typos.
              value: {{ toJson $runtimeProjects | quote }}
          ports:
            - name: http
              containerPort: {{ .Values.service.port }}
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
