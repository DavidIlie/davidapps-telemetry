{{- range $project := .Values.projects }}
{{- $ingress := default dict $project.ingress }}
{{- $allowFaro := eq (include "telemetry-gateway.routeEnabled" (dict "project" $project "key" "allowFaro" "default" true)) "true" }}
{{- $allowTraces := eq (include "telemetry-gateway.routeEnabled" (dict "project" $project "key" "allowTraces" "default" true)) "true" }}
{{- $allowLogs := eq (include "telemetry-gateway.routeEnabled" (dict "project" $project "key" "allowLogs" "default" false)) "true" }}
{{- $allowMetrics := eq (include "telemetry-gateway.routeEnabled" (dict "project" $project "key" "allowMetrics" "default" false)) "true" }}
{{- if or $allowFaro $allowTraces $allowLogs $allowMetrics }}
{{- range $host := $project.hosts }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: telemetry-{{ $project.id }}-{{ $host | replace "." "-" }}
  labels:
    {{- include "telemetry-gateway.labels" $ | nindent 4 }}
    app.davidapps.dev/telemetry-project: {{ $project.id | quote }}
  annotations:
    nginx.ingress.kubernetes.io/limit-connections: {{ default 20 $project.ratePerSecond | quote }}
    nginx.ingress.kubernetes.io/limit-rps: {{ default 20 $project.ratePerSecond | quote }}
    nginx.ingress.kubernetes.io/proxy-body-size: {{ printf "%dk" (div (int64 $.Values.gateway.maxBodyBytes) 1024) | quote }}
    {{- with $ingress.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  ingressClassName: {{ default "external" $ingress.className }}
  rules:
    - host: {{ $host | quote }}
      http:
        paths:
          {{- if $allowFaro }}
          - path: /collect
            pathType: Exact
            backend:
              service:
                name: {{ include "telemetry-gateway.name" $ }}
                port:
                  name: http
          {{- end }}
          {{- if $allowTraces }}
          - path: /v1/traces
            pathType: Exact
            backend:
              service:
                name: {{ include "telemetry-gateway.name" $ }}
                port:
                  name: http
          {{- end }}
          {{- if $allowLogs }}
          - path: /v1/logs
            pathType: Exact
            backend:
              service:
                name: {{ include "telemetry-gateway.name" $ }}
                port:
                  name: http
          {{- end }}
          {{- if $allowMetrics }}
          - path: /v1/metrics
            pathType: Exact
            backend:
              service:
                name: {{ include "telemetry-gateway.name" $ }}
                port:
                  name: http
          {{- end }}
  {{- with $ingress.tlsSecretName }}
  tls:
    - hosts: [{{ $host | quote }}]
      secretName: {{ . | quote }}
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
