name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* tag to publish or repair
        required: true
        type: string

# Publishing is immutable and partially ordered (core before adapters). Never let
# two release or repair runs interleave, and never cancel after publishing starts.
concurrency:
  group: npm-release
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: davidapps-ubuntu
    environment: npm
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.RELEASE_TAG }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          package-manager-cache: false

      # Trusted publishing requires a recent npm CLI. Pin the exact version:
      # this job holds the OIDC token and npm credentials, so a floating range
      # would be a supply-chain hole in the publish path. NPM_TOKEN remains a
      # temporary bootstrap path until every package has an npm trusted publisher.
      - run: npm install --global npm@11.19.0
      - run: corepack enable

      - name: Resolve and verify release ref
        shell: bash
        run: |
          set -euo pipefail
          release_sha=$(git rev-parse HEAD)
          if [[ "${{ github.event_name }}" == "push" && "$release_sha" != "$GITHUB_SHA" ]]; then
            echo "Checked-out tag SHA $release_sha does not match event SHA $GITHUB_SHA" >&2
            exit 1
          fi
          echo "RELEASE_SHA=$release_sha" >> "$GITHUB_ENV"

      - run: pnpm install --frozen-lockfile
      - run: node scripts/release-preflight.mjs --tag "$RELEASE_TAG" --sha "$RELEASE_SHA"
      - run: pnpm release:verify

      - name: Pack all npm packages
        run: node scripts/pack-packages.mjs --output "$RUNNER_TEMP/npm-packages"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-packages-${{ env.RELEASE_TAG }}
          path: ${{ runner.temp }}/npm-packages
          if-no-files-found: error
          retention-days: 14

      - name: Configure npm authentication
        shell: bash
        env:
          BOOTSTRAP_NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          npmrc="$RUNNER_TEMP/npm-release.npmrc"
          printf 'registry=https://registry.npmjs.org/\n' > "$npmrc"
          if [[ -n "${BOOTSTRAP_NPM_TOKEN:-}" ]]; then
            printf '//registry.npmjs.org/:_authToken=%s\n' "$BOOTSTRAP_NPM_TOKEN" >> "$npmrc"
            echo "Using the temporary npm token bootstrap path."
          else
            echo "No npm token configured; using npm trusted publishing (OIDC)."
          fi
          chmod 600 "$npmrc"
          echo "NPM_CONFIG_USERCONFIG=$npmrc" >> "$GITHUB_ENV"

      - name: Preflight registry and publish in dependency order
        run: >-
          node scripts/publish-packages.mjs
          --manifest "$RUNNER_TEMP/npm-packages/manifest.json"
          --registry https://registry.npmjs.org/

      - name: Remove temporary npm authentication
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/npm-release.npmrc"
